name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and 100% core coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test backend
        run: python -m pytest
      - name: Install frontend dependencies
        working-directory: interface
        run: npm ci --include=dev
      - name: Test frontend
        working-directory: interface
        run: npm test
      - name: Build frontend
        working-directory: interface
        run: npm run build
      - name: Import backend
        run: python -c "from server.app.main import app; assert app is not None"

  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Build executable
        shell: powershell
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bileter-windows-${{ github.sha }}
          path: dist/WebExeStarter.exe
          if-no-files-found: error
          retention-days: 14
