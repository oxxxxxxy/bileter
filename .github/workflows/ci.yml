name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-hall:
    name: Backend / Hall logic / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -o addopts= tests/test_hall.py

  backend-models:
    name: Backend / Models / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -o addopts= tests/test_models.py

  backend-repository:
    name: Backend / Repository parsing / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -o addopts= tests/test_repository_helpers.py

  frontend-format:
    name: Frontend / Format utils / Node 24.x
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci --include=dev
        working-directory: interface
      - run: npx vitest run src/utils/format.test.ts --coverage=false
        working-directory: interface

  frontend-hall:
    name: Frontend / Hall layout / Node 24.x
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci --include=dev
        working-directory: interface
      - run: npx vitest run src/utils/hallLayout.test.ts --coverage=false
        working-directory: interface

  frontend-ticket:
    name: Frontend / Ticket layout / Node 24.x
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci --include=dev
        working-directory: interface
      - run: npx vitest run src/utils/ticketLayout.test.ts --coverage=false
        working-directory: interface

  coverage:
    name: Coverage / 100% business core
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: npm ci --include=dev
        working-directory: interface
      - run: npm test
        working-directory: interface

  build-docs:
    name: Build and docs / Node 24.x
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: python -m pip install -r server/requirements.txt
      - run: python -m compileall -q launcher.py server
      - run: python -c "from server.app.main import app; assert app is not None"
      - run: npm ci --include=dev
        working-directory: interface
      - run: npm run build
        working-directory: interface
      - name: Verify documentation
        run: test -s README.md && test -s README_BUILD_WINDOWS.md && test -s README_DISTRIBUTION_WINDOWS.md && test -s AGENTS.md

  security:
    name: Dependency and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci --include=dev
        working-directory: interface
      - run: npm audit --audit-level=high
        working-directory: interface
      - name: Reject committed secrets and generated files
        run: |
          ! git grep -nE 'ghp_[A-Za-z0-9]{30,}'
          test -z "$(git ls-files 'interface/coverage/*' 'interface/*.tsbuildinfo')"

  windows:
    name: Windows executable / Python 3.12 / Node 24.x
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Build executable
        shell: powershell
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bileter-windows-${{ github.sha }}
          path: dist/WebExeStarter.exe
          if-no-files-found: error
          retention-days: 14

  ci-result:
    name: CI / Required result
    if: always()
    runs-on: ubuntu-latest
    needs:
      - backend-hall
      - backend-models
      - backend-repository
      - frontend-format
      - frontend-hall
      - frontend-ticket
      - coverage
      - build-docs
      - security
      - windows
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          failed = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if failed:
              raise SystemExit(f"Required checks failed: {failed}")
          print(f"All {len(results)} required checks passed.")
          PY
