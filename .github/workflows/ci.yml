name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-hall:
    name: CI / Backend hall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run shard
        run: pytest -q tests/test_hall.py

  backend-models:
    name: CI / Backend models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run shard
        run: pytest -q tests/test_models.py

  backend-repository:
    name: CI / Backend repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run shard
        run: pytest -q tests/test_repository_helpers.py

  frontend-format:
    name: CI / Frontend format utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Install frontend dependencies
        working-directory: interface
        run: npm ci --include=dev
      - name: Run shard
        working-directory: interface
        run: npx vitest run src/utils/format.test.ts

  frontend-hall-layout:
    name: CI / Frontend hall layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Install frontend dependencies
        working-directory: interface
        run: npm ci --include=dev
      - name: Run shard
        working-directory: interface
        run: npx vitest run src/utils/hallLayout.test.ts

  frontend-ticket-layout:
    name: CI / Frontend ticket layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Install frontend dependencies
        working-directory: interface
        run: npm ci --include=dev
      - name: Run shard
        working-directory: interface
        run: npx vitest run src/utils/ticketLayout.test.ts

  build-and-docs:
    name: CI / Build and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: interface
        run: npm ci --include=dev
      - name: Backend import smoke
        run: python -c "from server.app.main import app; assert app is not None"
      - name: Frontend build
        working-directory: interface
        run: npm run build
      - name: Docs smoke
        run: |
          test -f README.md
          test -f README_BUILD_WINDOWS.md
          test -f README_DISTRIBUTION_WINDOWS.md
          test -f AGENTS.md

  ci-result:
    name: CI / CI result
    runs-on: ubuntu-latest
    needs:
      - backend-hall
      - backend-models
      - backend-repository
      - frontend-format
      - frontend-hall-layout
      - frontend-ticket-layout
      - build-and-docs
    steps:
      - name: Final status
        run: echo "All required CI jobs passed."
