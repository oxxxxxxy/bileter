name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            name: WebExeStarter-x86
            python-arch: x86
          - arch: x64
            name: WebExeStarter-x64
            python-arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Build executable
        shell: powershell
        run: .\build_windows.ps1 -Name "${{ matrix.name }}" -Arch "${{ matrix.arch }}"

      - name: Create convenience binary aliases
        shell: powershell
        run: |
          Copy-Item "dist\${{ matrix.name }}.exe" "dist\Билеты-${{ matrix.arch }}.exe"

      - name: Upload artifact (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.exe
            dist/Билеты-${{ matrix.arch }}.exe
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.exe
          generate_release_notes: true
